# Planizi - configuration du proxy (copiee dans l'image par proxy.Dockerfile)

server {
    listen 80;
    server_name _;

    # Serveur DNS interne de Docker : le nom "metier" est resolu a chaque
    # requete (cache 10 s). Si le conteneur metier est recree et change
    # d'adresse, le proxy le retrouve sans redemarrer.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $metier http://metier:8000;

    # Fichiers du client servis directement par nginx
    location /static/ {
        root /usr/share/nginx/html;
        expires 1h;
        access_log off;
    }

    # Tout le reste (pages Flask, formulaires) -> service metier, PAR SON NOM
    location / {
        proxy_pass $metier;
        proxy_set_header Host              $http_host;   # garde le port 8080
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
